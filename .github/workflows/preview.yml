name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

env:
  LEFTHOOK: "0"
  STAGE: pr-${{ github.event.pull_request.number }}

jobs:
  deploy-preview:
    name: Deploy PR Preview
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.preview-url.outputs.url }}
    timeout-minutes: 20
    steps:
      - name: Check preview credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_ORG: ${{ vars.TURSO_ORG }}
          AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$TURSO_TOKEN" ] && missing="$missing TURSO_API_TOKEN"
          [ -z "$TURSO_ORG" ] && missing="$missing TURSO_ORG"
          [ -z "$AUTH_SECRET" ] && missing="$missing BETTER_AUTH_SECRET"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Preview deploy skipped"
              echo "Configure the following in the GitHub \`preview\` environment to enable automatic PR previews:"
              echo "\`${missing# }\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.configured == 'true'
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.creds.outputs.configured == 'true'

      - name: Install dependencies & build client
        if: steps.creds.outputs.configured == 'true'
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Deploy ephemeral preview stack (Alchemy)
        if: steps.creds.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_ORG: ${{ vars.TURSO_ORG }}
          TURSO_GROUP: ${{ vars.TURSO_GROUP || 'default' }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SPONSOR_SECRET_KEY: ${{ secrets.SPONSOR_SECRET_KEY }}
          MINT_AUTHORITY_SECRET_KEY: ${{ secrets.MINT_AUTHORITY_SECRET_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          TREASURY_WALLET: ${{ vars.TREASURY_WALLET }}
          WIKIGEMS_RELEASE_TAG: pr-${{ github.event.pull_request.number }}
          WIKIGEMS_RELEASE_MESSAGE: "PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.sha }})"
        run: bun run --cwd infra alchemy deploy --stage "$STAGE" --yes --no-input

      - name: Apply database migrations to ephemeral Turso DB
        if: steps.creds.outputs.configured == 'true'
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_ORG: ${{ vars.TURSO_ORG }}
        run: bun run db:migrate:stage -- --stage="$STAGE"

      - name: Resolve preview URL
        id: preview-url
        if: steps.creds.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          url="$(bun infra/scripts/worker-url.ts --stage="$STAGE")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Run live smoke check
        if: steps.creds.outputs.configured == 'true'
        run: bun run smoke "${{ steps.preview-url.outputs.url }}"

      - name: Comment preview URL on PR
        if: steps.creds.outputs.configured == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = "<!-- wikigems-preview -->";
            const stage = process.env.STAGE;
            const url = process.env.PREVIEW_URL;
            const sha = process.env.HEAD_SHA.slice(0, 7);
            const body = [
              marker,
              `### Preview environment ready (\`${stage}\`)`,
              "",
              `- **URL:** ${url}`,
              `- **Turso DB:** \`wikigems-${stage}\` (ephemeral, destroyed on PR close)`,
              `- **R2 Bucket:** \`wikigems-avatars-${stage}\``,
              `- **Commit:** \`${sha}\``,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  destroy-preview:
    name: Teardown PR Preview
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 15
    steps:
      - name: Check preview credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_ORG: ${{ vars.TURSO_ORG }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$TURSO_TOKEN" ] || [ -z "$TURSO_ORG" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.configured == 'true'
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.creds.outputs.configured == 'true'

      - name: Destroy ephemeral preview resources (Worker, R2, Turso DB)
        if: steps.creds.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_ORG: ${{ vars.TURSO_ORG }}
          TURSO_GROUP: ${{ vars.TURSO_GROUP || 'default' }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'teardown-placeholder-secret' }}
        run: |
          bun install --frozen-lockfile
          bun run --cwd infra alchemy destroy --stage "$STAGE" --yes --no-input

      - name: Update PR comment after teardown
        if: steps.creds.outputs.configured == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const marker = "<!-- wikigems-preview -->";
            const stage = process.env.STAGE;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `${marker}\n### Preview environment torn down (\`${stage}\`)\n\nWorker, R2 bucket, and ephemeral Turso database have been destroyed.`,
              });
            }
