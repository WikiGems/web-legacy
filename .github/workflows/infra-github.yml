name: GitHub Governance (IaC)

on:
  pull_request:
    paths:
      - "infra/github.run.ts"
      - "infra/src/state.ts"
      - "infra/package.json"
  push:
    branches: [main]
    paths:
      - "infra/github.run.ts"
      - "infra/src/state.ts"
      - "infra/package.json"
  workflow_dispatch:
    inputs:
      adopt:
        description: "Pass --adopt to import existing GitHub repository/rulesets into state"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: infra-github
  cancel-in-progress: false

env:
  LEFTHOOK: "0"

jobs:
  reconcile:
    name: Reconcile GitHub Settings & Rulesets
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Check governance token
        id: creds
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_GOVERNANCE_TOKEN }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$GH_ADMIN_TOKEN" ] || [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping GitHub IaC reconciliation (configure GH_GOVERNANCE_TOKEN, CLOUDFLARE_API_TOKEN, and CLOUDFLARE_ACCOUNT_ID in the production environment)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.configured == 'true'
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.creds.outputs.configured == 'true'

      - name: Install dependencies
        if: steps.creds.outputs.configured == 'true'
        run: bun install --frozen-lockfile

      - name: Plan GitHub governance stack
        if: steps.creds.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_GOVERNANCE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run --cwd infra alchemy plan github.run.ts --stage main --no-input --detailed

      - name: Apply GitHub governance stack
        if: >
          steps.creds.outputs.configured == 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ secrets.GH_GOVERNANCE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          adopt_flag=""
          if [ "${{ inputs.adopt }}" = "true" ]; then
            adopt_flag="--adopt"
          fi
          bun run --cwd infra alchemy deploy github.run.ts --stage main --yes --no-input $adopt_flag
