[workspace]
members = ["programs/wikigems"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
anchor-lang = "=1.2.2"
mpl-core = "=0.12.1"
anchor-spl = { version = "=1.2.2", default-features = false, features = [
  "token",
  "token_2022",
  "associated_token",
  "solana-v3",
] }
litesvm = "=0.18.2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
